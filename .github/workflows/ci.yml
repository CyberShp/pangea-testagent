name: V1 tests and Windows package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Core and protocol integration tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: node scripts/test-ui.cjs
  linux-tools:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y musl-tools make file
      - run: python scripts/build-load-tools.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tools-${{ matrix.os }}
          path: tool-bundles/*.zip
          if-no-files-found: error
  windows-package:
    needs: [test, ui, linux-tools]
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-tools-*
          path: tool-bundles
          merge-multiple: true
      - name: Build portable runtime
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify portable and update archives
        run: python scripts/check-release.py
      - uses: actions/checkout@v4
        with:
          ref: 4dc64ef96cad5c271123cc0f87515f452984de31
          path: baseline-1.0.2
      - name: Upgrade released 1.0.2 using downloaded patch
        run: python scripts/test-windows-upgrade.py
      - uses: actions/checkout@v4
        with:
          ref: db84cee608c09b810e1e842fe787b087a626f4d5
          path: baseline-1.0.3
      - name: Upgrade released 1.0.3 with data and preset checks
        run: python scripts/test-windows-upgrade.py --baseline 1.0.3
      - uses: actions/checkout@v4
        with:
          ref: 0c5ffb2fd604c204a8df9d7d8766482eb36a75cf
          path: baseline-1.1.0
      - name: Upgrade 1.1.0 and verify raw Vdbench import
        run: python scripts/test-windows-upgrade.py --baseline 1.1.0
      - name: Smoke packaged executable
        shell: pwsh
        run: |
          $env:TESTAGENT_DATA_DIR = Join-Path $env:RUNNER_TEMP 'testagent-smoke'
          $entry = Join-Path (Get-Location) 'dist/portable/app/entry.py'
          $p = Start-Process 'dist/portable/app/runtime/pythonw.exe' -ArgumentList "`"$entry`" --serve --port 18765" -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:18765/api/health'
                if ($health.version -eq '1.1.1') { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'Packaged server did not become ready' }
          } finally { Stop-Process -Id $p.Id -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: pangea-testagent-1.1.1-full-windows-x64
          path: dist/full-artifact/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pangea-testagent-1.1.1-patch-windows-x64
          path: dist/patch-artifact/
          if-no-files-found: error
