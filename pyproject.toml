[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testagent"
version = "1.0.0"
description = "Independent skill-driven test environment workbench"
requires-python = ">=3.12"
dependencies = ["paramiko==5.0.0", "cryptography==46.0.0", "jsonschema==4.26.0"]

[tool.setuptools.packages.find]
where = ["src"]
